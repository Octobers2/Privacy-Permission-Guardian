<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wikipedia</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #202124; }
  .wrap { max-width: 520px; margin: 48px auto; background: #fff; padding: 32px; border-radius: 12px;
           box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lede { margin: 0 0 24px; color: #5f6368; font-size: 14px; }
  label { display: block; margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
  input, select { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
                   border: 1px solid #dadce0; border-radius: 6px; }
  button { margin-top: 22px; width: 100%; padding: 11px; font-size: 15px; border: 0;
            border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

<h1>Wikipedia</h1>
<p class="lede">The free encyclopedia</p>
<form action="/search" method="get">
  <label for="q">Search</label>
  <input id="q" name="q" placeholder="Search Wikipedia">
  <button type="submit">Search</button>
</form>
</div>
</body>
</html>
