<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout — Goodstore</title>
<link rel="icon" href="/favicon.ico">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #1f2328; }
  .wrap { max-width: 520px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 10px;
          border: 1px solid #e4e6ea; }
  h1 { font-size: 19px; margin: 0 0 20px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
          border: 1px solid #d0d7de; border-radius: 6px; }
  button { margin-top: 20px; width: 100%; padding: 11px; font-size: 15px; border: 0;
           border-radius: 6px; background: #1f883d; color: #fff; cursor: pointer; }
  .note { color: #656d76; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">

<h1>Checkout</h1>

<!-- Posts to its own origin, like a real merchant. -->
<form action="/checkout/confirm" method="post">
  <label for="nm">Name on card</label>
  <input id="nm" name="cardholder" autocomplete="cc-name" required>
  <label for="cc">Card number</label>
  <input id="cc" name="cardnum" autocomplete="cc-number" required>
  <label for="ex">Expiry</label>
  <input id="ex" name="exp" autocomplete="cc-exp" placeholder="MM/YY" required>
  <label for="cv">Security code</label>
  <input id="cv" name="cvc" autocomplete="cc-csc" required>
  <label for="ad">Billing address</label>
  <input id="ad" name="address" autocomplete="street-address" required>
  <button type="submit">Pay £42.00</button>
</form>

<p class="note">Payments are processed by Stripe. We never store your card number.</p>
</div>

<!-- The false-positive case this fixture exists for: an ordinary checkout talks
     to a payment provider, a tag manager and an error reporter on every load.
     If `sensitive_post_third_party` fires here, the rule is unusable. -->
<script type="text/plain" data-ppg-defused="1">
  loadScript("https://js.stripe.com/v3/");
  loadScript("https://www.googletagmanager.com/gtag/js?id=G-ABC123");
  navigator.sendBeacon("https://www.google-analytics.com/g/collect", payload);
  Sentry.init({ dsn: "https://abc123@o12345.ingest.sentry.io/456" });
  loadScript("https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js");
</script>
</body>
</html>
