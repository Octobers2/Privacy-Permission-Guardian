    const root = document.getElementById('root');
    root.textContent = '';
    const heading = document.createElement('h1');
    heading.textContent = 'Privacy Policy';
    root.append(heading);
    for (const text of data.paragraphs) {

      p.textContent = text;
      root.append(p);
