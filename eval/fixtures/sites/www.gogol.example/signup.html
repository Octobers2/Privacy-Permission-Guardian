<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your Gogol Account - Gogol</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#202124;background:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid #dadce0}
.brand{font-size:26px;font-weight:500;text-decoration:none;color:#4285f4;letter-spacing:-.5px}.top nav a{margin-left:18px;color:#5f6368;text-decoration:none;font-size:14px}
main{max-width:720px;margin:0 auto;padding:48px 24px}.hero{text-align:center}.hero h1{font-size:34px;font-weight:400;margin:0 0 14px}.hero p{color:#5f6368;font-size:17px;line-height:1.5}
.cta{display:inline-block;background:#1a73e8;color:#fff;border-radius:4px;padding:10px 24px;text-decoration:none;margin:6px}.cta.alt{background:#fff;color:#1a73e8;border:1px solid #dadce0}
.card{border:1px solid #dadce0;border-radius:8px;padding:32px}.card h1{margin-top:0;font-weight:400}
label{display:block;margin:14px 0;font-size:14px;color:#5f6368}input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #dadce0;border-radius:4px;font-size:16px}
small,.fine{color:#80868b;font-size:12px}button{background:#1a73e8;color:#fff;border:0;border-radius:4px;padding:10px 24px;font-size:15px;cursor:pointer}
.doc{line-height:1.65;font-size:15px}.doc h2{margin-top:28px;font-size:18px;font-weight:500}footer{border-top:1px solid #dadce0;background:#f2f2f2;padding:16px 24px;font-size:12px;color:#70757a}footer a{color:#5f6368;margin-right:16px}</style></head>
<body>
<header class="top"><a class="brand" href="/">Gogol</a><nav><a href="/signup">Create your Gogol Account</a> <a href="/verify">Verify your identity</a></nav></header>
<main>
<section class="card">
  <h1>Create your Gogol Account</h1>
  <p>One account for search, mail, maps, photos and storage.</p>
  <form action="#" method="post" onsubmit="return false">
    <label>First name
      <input name="first_name" type="text" autocomplete="given-name">
    </label>
    <label>Last name
      <input name="last_name" type="text" autocomplete="family-name">
    </label>
    <label>Choose a username
      <input name="username" type="text" autocomplete="username">
      <small>This becomes your @gogolmail.example address.</small>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password">
    </label>
    <label>Phone number
      <input name="phone" type="tel" autocomplete="tel">
      <small>We use it for security and to personalise ads.</small>
    </label>
    <label>Date of birth
      <input name="birthday" type="date" autocomplete="bday">
    </label>
    <label>Gender
      <input name="gender" type="text">
    </label>
    <label>Recovery email
      <input name="recovery_email" type="email">
    </label>
    <button type="submit">Next</button>
  </form>
</section>
</main>
<footer>
  <nav aria-label="Footer">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms of Service</a>
    <a href="/traffic">Maps traffic conditions</a>
    <a href="/help">Help</a>
    <a href="/about">About</a>
  </nav>
  <p>Fictional test site for the Privacy &amp; Permission Guardian fixtures. Gogol is not a real company.</p>
</footer>
</body>
</html>
