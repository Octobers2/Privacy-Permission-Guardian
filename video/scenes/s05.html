<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>s05 Phishing and missing terms</title><link rel="stylesheet" href="lib.css"></head>
<body><div class="stage"></div>
<script src="../footage/marks.js"></script><script src="lib.js"></script>
<script>
scene((C, D, E) => {
  const S = '.stage';
  sweep(0, 'left', '#e1251b', 240);
  add(S, '<div class="block red"></div>', { left: '0px', top: '0px', width: '40px', height: '1080px' });

  // ---- 0: three threats, dealt like cards, one for each thing the voice names
  const p0 = panel(0, C(1) - 100);
  snap(add(p0, '<div class="abs black big">THE SECOND</div>', { left: '120px', top: '90px' }), C(0), 'left', 240);
  snap(add(p0, '<div class="abs black big txt-red">PROBLEM</div>', { left: '120px', top: '290px' }), C(0) + 200, 'right', 240);
  const cards = [
    { at: F(C, 0, 0.3), label: 'FAKE LOGO', icon: '<svg viewBox="0 0 200 200" width="230" height="230"><rect x="20" y="20" width="160" height="160" fill="#fff"/><text x="100" y="135" text-anchor="middle" font-family="Archivo Black" font-size="110" fill="#111">G</text><rect x="120" y="20" width="60" height="60" fill="#e1251b"/><text x="150" y="68" text-anchor="middle" font-family="Archivo Black" font-size="48" fill="#fff">?</text></svg>' },
    { at: F(C, 0, 0.55), label: 'FORM THAT LEAKS', icon: '<svg viewBox="0 0 200 200" width="230" height="230"><rect x="20" y="40" width="110" height="120" fill="none" stroke="#fff" stroke-width="10"/><rect x="40" y="70" width="70" height="14" fill="#fff"/><rect x="40" y="100" width="70" height="14" fill="#fff"/><path d="M130 100 H190 M165 70 L195 100 L165 130" fill="none" stroke="#e1251b" stroke-width="14"/></svg>' },
    { at: F(C, 0, 0.8), label: 'BLOCKED DEVTOOLS', icon: '<svg viewBox="0 0 200 200" width="230" height="230"><text x="100" y="125" text-anchor="middle" font-family="Archivo Black" font-size="100" fill="#fff">{ }</text><circle cx="100" cy="100" r="80" fill="none" stroke="#e1251b" stroke-width="14"/><path d="M44 156 L156 44" stroke="#e1251b" stroke-width="14"/></svg>' },
  ];
  cards.forEach((c, i) => {
    const card = add(p0, '<div class="abs"></div>', { left: 120 + i * 590 + 'px', top: '570px', width: '540px', height: '400px', border: '10px solid #e1251b' });
    snap(card, c.at, 'down', 260, 120);
    add(card, `<div class="abs">${c.icon}</div>`, { left: '40px', top: '20px' });
    add(card, `<div class="abs black" style="font-size:50px;left:30px;bottom:24px;line-height:.95">${c.label}</div>`);
  });

  // ---- 1-2: a lookalike sign-in
  const a = browser(S, { left: 620, top: 110, width: 1220, address: 'account-verify-center.top' });
  between(a.frame, C(1) - 40, C(3) - 100);
  snap(a.frame, C(1) - 40, 'right', 260, 40);
  add(a.frame.querySelector('.bar'), '<span style="margin-left:auto;display:flex;align-items:center;gap:10px"><b style="display:grid;place-items:center;width:28px;height:28px;background:#fff;color:#111;font:900 20px Archivo Black">G</b><em style="font:700 18px Archivo;color:#fff;font-style:normal">Verify your account</em></span>');
  segment(a.screen, 'phish', 'load', 'reasons', C(1) - 40, C(3) - 100, { maxSpeed: 1 });
  say(S, 'A FAMILIAR<br>SIGN-IN.', C(1), F(C, 1, 0.5), { style: 'stamp', left: 80, top: 400, width: 500, size: 66, tag: 'PHISHING' });
  say(S, 'BORROWED ICON.<br>OTHER DESTINATION.', F(C, 1, 0.5), C(2), { style: 'words', left: 80, top: 400, width: 500, size: 56, tag: 'PHISHING' });
  say(S, 'CRITICAL RISK.<br>BEFORE YOU TYPE.', C(2), C(3), { style: 'band', left: 80, top: 400, width: 500, size: 58, tag: 'GUARDIAN' });
  const ring = add(a.frame, '<div class="abs"></div>', { right: '222px', top: '3px', width: '44px', height: '38px', border: '5px solid #e1251b', zIndex: 5 });
  between(ring, F(C, 1, 0.5), C(2) - 300);
  snap(ring, F(C, 1, 0.5), 'pop', 180);

  callout(a.screen, [32, 27, 30, 40], 'FORM POSTS TO ANOTHER SITE', F(C, 1, 0.62), C(2) - 100, { tab: 'bottom' });
  callout(a.screen, [0, 0, 100, 25], 'CRITICAL RISK, BEFORE YOU TYPE', C(2) + 300, C(3) - 100, { tab: 'bottom' });

  // ---- 3: a checkout that is probably genuine
  const b = browser(S, { left: 620, top: 110, width: 1220, address: 'shop.example.com/checkout' });
  between(b.frame, C(3) - 40, C(4) - 100);
  snap(b.frame, C(3) - 40, 'down', 260, 60);
  segment(b.screen, 'bank', 'load', 'banner', C(3) - 40, C(4) - 100, { maxSpeed: 1 });
  callout(b.screen, [0, 0, 100, 13], 'CAUTION, NOT DANGER', F(C, 3, 0.35), C(4) - 100, { tab: 'bottom' });
  say(S, 'A CARD NUMBER?<br>CAUTION.', C(3), C(4), { style: 'type', left: 80, top: 400, width: 500, size: 62, tag: 'NOT EVERY WARNING IS RED' });

  // ---- 4: no terms at all: the page, the model reading it, the report, the public list
  const q1 = F(C, 4, 0.2), q2 = F(C, 4, 0.5), q3 = F(C, 4, 0.78);
  const c = browser(S, { left: 620, top: 110, width: 1220, address: 'quickloan-demo.com/signup' });
  between(c.frame, C(4) - 40, q1);
  snap(c.frame, C(4) - 40, 'right', 260, 40);
  segment(c.screen, 'quickloan-page', 0.3, 'banner', C(4) - 40, q1, { maxSpeed: 1 });
  callout(c.screen, [0, 0, 100, 20], 'NO LINK TO ANY TERMS', C(4) + 600, q1 - 100, { tab: 'bottom' });
  const pop = popupFrame(S, { left: 1200, top: 60, height: 960 });
  between(pop.frame, q1, q2);
  snap(pop.frame, q1, 'right', 240, 50);
  segment(pop.screen, 'quickloan-popup', 'idle', 'end', q1, q2, { maxSpeed: 3 });
  const d = browser(S, { left: 620, top: 110, width: 1220, address: 'quickloan-demo.com/signup' });
  between(d.frame, q2, q3);
  segment(d.screen, 'quickloan-banner', 'findings', 'reported', q2, q3, { maxSpeed: 1.6 });
  callout(d.screen, [0, 0, 100, 22], 'WHAT THE MODEL FOUND ON THE PAGE', q2 + 400, q2 + 4000, { tab: 'bottom' });
  const e = browser(S, { left: 620, top: 110, width: 1220, address: 'ppg server · reported as having no terms' });
  between(e.frame, q3, C(5) - 100);
  segment(e.screen, 'site-home', 'missing', 'missing', q3, C(5) - 100, { maxSpeed: 1 });
  say(S, 'ASKS FOR A CARD.<br>NO TERMS.', C(4), q1, { style: 'slide', left: 80, top: 400, width: 500, size: 62, tag: 'NO TERMS FOUND' });
  say(S, 'THE MODEL<br>READS THE PAGE.', q1, q2, { style: 'words', left: 80, top: 400, width: 500, size: 56, tag: 'NO TERMS FOUND' });
  say(S, 'ONE CLICK<br>TO REPORT IT.', q2, q3, { style: 'stamp', left: 80, top: 400, width: 500, size: 60, tag: 'REPORT' });
  say(S, 'OTHERS ARE TOLD.', q3, C(5) - 100, { style: 'band', left: 80, top: 400, width: 500, size: 58, tag: 'PUBLIC LIST' });

  // ---- 5: it needs no model
  const p5 = panel(C(5) - 100, null);
  p5.style.background = '#e1251b';
  sweep(C(5) - 100, 'down', '#111', 240);
  say(p5, 'NO MODEL.', C(5), null, { style: 'stamp', left: 120, top: 190, width: 1600, size: 190 });
  say(p5, 'NO SERVER.', C(5) + 350, null, { style: 'stamp', left: 120, top: 420, width: 1600, size: 190, color: '#111' });
  say(p5, 'FROM DAY ONE.', C(5) + 700, null, { style: 'stamp', left: 120, top: 650, width: 1700, size: 190 });
});
</script></body></html>
