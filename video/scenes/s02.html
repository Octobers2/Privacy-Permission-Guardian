<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>s02 The hidden cost</title><link rel="stylesheet" href="lib.css"></head>
<body><div class="stage"></div>
<script src="../data/survey.js"></script><script src="lib.js"></script>
<script>
scene((C, D, E) => {
  const S = SURVEY;
  const eyebrow = (p, text, at) => { const n = add(p, `<div class="abs small">${text}</div>`, { left: '120px', top: '90px' }); snap(n, at, 'left', 200, 60); return n; };

  // ---- 0: who we asked, and the one who reads
  const p0 = panel(0, C(1) - 100);
  eyebrow(p0, 'Our survey · 31 people', C(0));
  const one = add(p0, `<div class="abs black" style="font-size:520px;line-height:.8;color:#e1251b">${S.read.always}</div>`, { left: '120px', top: '170px' });
  snap(one, C(0) + 150, 'pop', 240);
  snap(add(p0, `<div class="abs black big">OF ${S.n}</div>`, { left: '520px', top: '230px' }), C(0) + 400, 'right', 260);
  snap(add(p0, '<div class="abs cap" style="width:900px">reads the terms in full.</div>', { left: '520px', top: '440px' }), F(C, 0, 0.6), 'left', 240, 80);
  const grid = add(p0, '<div class="abs"></div>', { left: '120px', top: '760px', width: '1500px' });
  for (let i = 0; i < S.n; i++) snap(add(grid, '<div class="block"></div>', { left: (i % 16) * 90 + 'px', top: Math.floor(i / 16) * 90 + 'px', width: '70px', height: '70px', background: i === 0 ? '#e1251b' : '#fff' }), C(0) + 500 + i * 30, 'pop', 150);

  // ---- 1: the two reasons, side by side
  const p1 = panel(C(1) - 100, C(2) - 100);
  const half = add(p1, '<div class="block red"></div>', { left: '960px', top: '0px', width: '960px', height: '1080px' });
  wipe(half, C(1), 'right', 280);
  const stat = (x, color, label, pct, at, bg) => {
    const n = add(p1, `<div class="abs black" style="font-size:330px;line-height:.85;color:${color}">0%</div>`, { left: x + 'px', top: '180px' });
    snap(n, at, x < 900 ? 'left' : 'right', 220);
    count(at + 100, 1000, 0, pct, (v) => (n.textContent = v + '%'));
    snap(add(p1, `<div class="abs black mid" style="color:${color}">${label}</div>`, { left: x + 'px', top: '560px' }), at + 300, 'up', 220, 60);
    const track = add(p1, `<div class="block" style="background:${bg}"></div>`, { left: x + 'px', top: '860px', width: '780px', height: '50px' });
    const fill = add(track, `<div class="block" style="background:${color}"></div>`, { left: '0', top: '0', height: '50px', width: pct + '%' });
    wipe(fill, at + 100, 'left', 1000);
  };
  stat(120, '#fff', 'TOO LONG', S.reasons.tooLong.percent, C(1) + 100, '#333');
  stat(1040, '#111', 'NO CHOICE', S.reasons.forced.percent, F(C, 1, 0.45), '#fff');
  snap(add(p1, '<div class="abs small">skip them because</div>', { left: '120px', top: '90px' }), C(1) + 100, 'left', 200, 60);
  snap(add(p1, '<div class="abs small" style="color:#fff">accept anyway because</div>', { left: '1040px', top: '90px' }), F(C, 1, 0.45), 'left', 200, 60);

  // ---- 2: what is hiding, as three slabs that each arrive differently
  const p2 = panel(C(2) - 100, C(3) - 100);
  snap(add(p2, '<div class="abs black" style="font-size:760px;color:#e1251b;line-height:.8">?</div>', { left: '1140px', top: '40px' }), C(2), 'spin', 300);
  say(p2, 'WHAT IS HIDING IN THERE?', C(2), F(C, 2, 0.28), { style: 'words', left: 120, top: 280, width: 1000, size: 150 });
  const slab = (from, to, a, b, cls, dir, how) => {
    const p = panel(from, to);
    const bg = add(p, `<div class="block ${cls}"></div>`, { left: '0px', top: '0px', width: '1920px', height: '1080px' });
    wipe(bg, from, dir, 220);
    const ink = cls === 'red' ? '#fff' : '#111';
    const l1 = add(p, `<div class="abs black" style="font-size:132px;white-space:nowrap;color:${ink}">${a}</div>`, { left: '120px', top: '340px' });
    const l2 = add(p, `<div class="abs black" style="font-size:${b.length > 22 ? 92 : 132}px;white-space:nowrap;color:${cls === 'red' ? '#111' : '#e1251b'}">${b}</div>`, { left: '120px', top: '520px' });
    snap(l1, from + 120, how, 240); snap(l2, from + 300, how === 'left' ? 'right' : 'left', 240);
  };
  slab(F(C, 2, 0.28), F(C, 2, 0.5), 'CLOSE YOUR ACCOUNT.', 'NO NOTICE.', 'red', 'left', 'left');
  slab(F(C, 2, 0.5), F(C, 2, 0.72), 'TERMS CHANGE', 'WHENEVER THEY LIKE.', 'paper', 'down', 'up');
  slab(F(C, 2, 0.72), C(3) - 100, 'AUTO-RENEWS. FEE TO LEAVE.', 'NO REFUNDS.', 'red', 'right', 'right');

  // ---- 3: the regulator, typed out like a record
  const p3 = panel(C(3) - 100, C(4) - 100);
  snap(add(p3, '<div class="abs small">2024 · United States Federal Trade Commission</div>', { left: '120px', top: '300px' }), C(3), 'left', 200, 60);
  say(p3, 'SUED ADOBE', C(3) + 150, C(4) - 100, { style: 'type', left: 120, top: '380', width: 1600, size: 150 });
  snap(add(p3, '<div class="abs cap" style="width:1500px">Alleging it hid early termination fees from subscribers.</div>', { left: '120px', top: '620px' }), C(3) + 1100, 'up', 240, 60);
  snap(add(p3, '<div class="block red"></div>', { left: '120px', top: '860px', width: '420px', height: '30px' }), C(3) + 700, 'left', 300);

  // ---- 4: accept
  const p4 = panel(C(4) - 100, null);
  p4.style.background = '#fff';
  const btn = add(p4, '<div class="abs black red" style="display:grid;place-items:center;font-size:200px;width:1100px;height:380px">ACCEPT</div>', { left: '410px', top: '330px' });
  snap(btn, C(4), 'pop', 240);
  const cur = add(p4, '<svg class="cursor" viewBox="0 0 24 24"><path d="M3 2l7 19 3-8 8-3z" fill="#111" stroke="#fff" stroke-width="1.5"/></svg>', { left: '1500px', top: '900px', width: '90px', height: '90px' });
  cur.animate([{ left: '1500px', top: '900px' }, { left: '1000px', top: '520px' }], { delay: C(4) + 300, duration: 800, easing: 'ease-in-out', fill: 'both' });
  btn.animate([{ transform: 'none' }, { transform: 'scale(.94)' }, { transform: 'none' }], { delay: C(4) + 1200, duration: 220, fill: 'both' });
  sfx(C(4) + 1200, 'click', 1.3);
  snap(add(p4, '<div class="abs small" style="color:#111">unread, every day</div>', { left: '410px', top: '760px' }), C(4) + 1300, 'up', 200, 60);
});
</script></body></html>
